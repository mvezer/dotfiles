[font]
size = 12
# normal = { family = "jetbrainsmono nerd font mono", style = "Regular" }
# normal = { family = "FiraCode Nerd Font Mono", style = "Regular" }
# normal = { family = "InconsolataGo Nerd Font Mono", style = "Regular" }
normal = { family = "Iosevka Nerd Font Mono", style = "Light" }
bold = { family = "Iosevka Nerd Font Mono", style = "Bold" }
italic = { family = "Iosevka Nerd Font Mono", style = "Italic" }

[cursor]
style = { shape = "Beam" }
vi_mode_style = { shape = "Block" }

[general]
live_config_reload = true
import = ["~/.config/alacritty/themes/one_dark.toml"]

[window]
# startup_mode = "Maximized"
decorations = "none"
option_as_alt = "Both"
opacity = 1.0
blur = false

[terminal.shell]
program = "tmux"

