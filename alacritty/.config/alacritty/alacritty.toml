[font]
size = 11
normal = { family = "jetbrainsmono nerd font mono", style = "Regular" }

[cursor]
style = { shape = "Beam" }
vi_mode_style = { shape = "Block" }

[general]
live_config_reload = true
import = [
    "~/.config/alacritty/themes/catppuccin_mocha.toml",
]

[window]
startup_mode = "Maximized"
decorations = "none"
option_as_alt = "Both"
opacity = 0.9
blur = false

