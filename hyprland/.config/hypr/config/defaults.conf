# General
$filemanager = thunar
$file_manager = thunar
$browser = vivaldi
$applauncher = wofi
$terminal = alacritty
$idlehandler = swayidle -w timeout 1800 'swaylock -f -c 000000' before-sleep 'swaylock -f -c 000000'

# Screenshots
$shot-region = grimblast copy area
$shot-window = grimblast copy active
$shot-screen = grimblast copy output
