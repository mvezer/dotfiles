# Monitor wiki https://wiki.hyprland.org/Configuring/Monitors/

monitor=eDP-1, 1920x1080, 0x360, 1
monitor=HDMI-A-1, 2560x1440, 1920x0, 1
workspace=1, monitor:HDMI-A-1,monitor:eDP-1
workspace=2, monitor:HDMI-A-1,monitor:eDP-1
workspace=3, monitor:HDMI-A-1,monitor:eDP-1
workspace=4, monitor:HDMI-A-1,monitor:eDP-1
workspace=5, monitor:HDMI-A-1,monitor:eDP-1
workspace=6, monitor:HDMI-A-1,monitor:eDP-1
workspace=7, monitor:HDMI-A-1,monitor:eDP-1
workspace=8, monitor:HDMI-A-1,monitor:eDP-1
workspace=9, monitor:eDP-1




# If you need to scale things like steam etc, please uncomment these lines.
#xwayland {
#  force_zero_scaling = true       # Unscale XWayland
#}

# Adjust GDK_SCALE accordingly to your liking.
#env = GDK_SCALE, 2                # GDK Scaling Factor (no fractional scaling)

# Electron based apps use X11 as default, auto should detect wayland
env = ELECTRON_OZONE_PLATFORM_HINT, auto
