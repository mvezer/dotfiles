[font]
size = 11.0
normal = { family = "JetBrainsMono Nerd Font Mono", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font Mono", style = "Italic" }

[terminal.shell]
program = "/usr/bin/zsh"
args = ["--login", "-c", "tmux attach || tmux new-session -s default"]

# claude shift+enter passthrough
[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
