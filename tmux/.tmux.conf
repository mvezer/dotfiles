unbind C-Space
set -g prefix C-Space
bind C-Space send-prefix

set-option -g allow-rename on
set-option -g automatic-rename on
set -g automatic-rename-format ' #{b:pane_current_path} '
set -sg escape-time 0
set -g history-limit 50000
set -g status-interval 5
set -g default-terminal "tmux-256color"
set-option -g default-shell "/bin/zsh"
set -g focus-events on
set -g mouse on
set -ga terminal-overrides ',*256color*:smcup@:rmcup@'
setw -g aggressive-resize on
set -g status-position top
set-option -g detach-on-destroy off

# copy mode
set-window-option -g mode-keys vi
bind-key -n C-a copy-mode
# connect to bebop
bind-key b new-session -d -s bebop \; switch-client -t bebop \; send-keys 'bebop' C-m

# setw -g mode-keys vi
unbind [
# bind-key -n C-a copy-mode
bind-key -n C-a capture-pane -eJS -1000 \; save-buffer ~/tmux.history \; delete-buffer \; display-popup -h 96% -w 96% -E "nvim +'lua Snacks.terminal.colorize(); vim.opt.relativenumber=true' ~/tmux.history"


unbind-key -T copy-mode-vi v
bind-key -T copy-mode-vi 'v' send -X begin-selection     # Begin selection in copy mode.
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle  # Begin selection in copy mode.
bind-key -T copy-mode-vi 'y' send -X copy-selection      # Yank selection in copy mode.
bind-key -T copy-mode-vi Escape {
    if-shell -F "#{selection_present}" {
        send-keys -X clear-selection
    } {
        send-keys -X cancel
    }
}
bind-key C-b choose-buffer # view the buffer stack

# look and feel
set -g status-style bg=colour235,fg=colour7
set -g window-status-style bg=colour235,fg=colour245
set -g window-status-current-style bg=colour240,fg=colour221
set -g window-status-current-format ' #(echo "#{pane_current_path}" | rev | cut -d'/' -f-3 | rev) '
set -g status-left-length 30
set -g renumber-windows on
set -g window-status-format '  #(echo "#{pane_current_path}" | rev | cut -d'/' -f-3 | rev) '
# set -g window-status-format '  #{pane_current_command}:#(echo "#{pane_current_path}" | rev | cut -d'/' -f-3 | rev) '
set -g status-left-style bg=colour147,fg=colour235
set -g renumber-windows on
set -g status-left " #S "
# set -g status-right "%d.%m.%Y %H:%M:%S"
set -g status-right ""

# toggle time display
set -g status-right ""
bind-key t if-shell '[ "$(tmux show -gv status-right)" = "%d.%m.%Y %H:%M:%S" ]' \
    'set -g status-right ""' \
    'set -g status-right "%d.%m.%Y %H:%M:%S"'

# highlight the active pane
set -g window-style 'fg=colour247,bg=colour236'
set -g window-active-style 'fg=colour250,bg=black'

bind r source-file ~/.tmux.conf \; display "Tmux config reloaded!"

# windows
bind-key -n M-w new-window -c "#{pane_current_path}"
bind-key -n M-W kill-window
bind -n M-Right next-window
bind -n M-Left previous-window
bind -n M-S-Right resize-pane -R
bind -n M-S-Left resize-pane -L
# bind-key -n M-q new-session \; run-shell -b "$HOME/.local/bin/rename-current-tmux-session.sh"
bind-key -n M-q new-session
bind-key -n M-S-q kill-session

is_nvim='[ "#{pane_current_command}" = "nvim" ]'

# panes
bind-key -n M-p split-window -h -c "#{pane_current_path}"
# bind-key -n M-h split-window -v -c "#{pane_current_path}"
bind-key -n M-P kill-pane
bind -n C-Left if-shell "$is_nvim" 'send-keys C-Left' 'select-pane -L'
bind -n C-S-Left swap-pane -D
bind -n C-Right if-shell "$is_nvim" 'send-keys C-Right' 'select-pane -R'
bind -n C-S-Right swap-pane -D
bind -n C-Up if-shell "$is_nvim" 'send-keys C-Up' 'select-pane -U'
bind -n C-Down if-shell "$is_nvim" 'send-keys C-Down' 'select-pane -D'
bind-key -n M-m resize-pane -Z

bind-key -n M-Down switch-client -n
bind-key -n M-Up switch-client -p

# plugins
set -g @plugin 'tmux-plugins/tpm'

# fzf session switcher
set -g @plugin 'vndmp4/tmux-fzf-session-switch'
set -g @fzf-goto-session-only 'true'
set -g @fzf-goto-session 'C-Space'

# popup window toggle
set -g @plugin "loichyan/tmux-toggle-popup"
bind-key g run "#{@popup-toggle} -w96% -h96% -Ed'##{pane_current_path}' --name=lazygit lazygit"
bind-key n run-shell '\
    current_session=$(tmux display-message -p "#S"); \
    if [ "$current_session" = "notes" ]; then \
        tmux switch-client -l; \
    else \
        if tmux has-session -t notes 2>/dev/null; then \
            tmux switch-client -t notes; \
        else \
            tmux new-session -d -s notes -c "$HOME/notes"; \
            tmux switch-client -t notes; \
        fi; \
    fi'

run '~/.tmux/plugins/tpm/tpm'

